name: Build and Release MonitorMonster

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and Package Windows Standalone
        shell: pwsh
        run: |
          pwsh ./windows/scripts/build.ps1
          Compress-Archive -Path ./dist/windows/* -DestinationPath ./dist/windows/MonitorMonster-win-x64.zip

      - name: Upload Windows Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.3' }}
          files: |
            dist/windows/MonitorMonster.exe
            dist/windows/MonitorMonster-win-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
